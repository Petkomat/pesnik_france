# Statična različica generatorja sonetov na GitHub Pages.
# Stran sestavi iz github_pages/ + img/ + vrstice.txt (verzi so tako samo na enem mestu).
name: GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "github_pages/**"
      - "img/**"
      - "vrstice.txt"
      - ".github/workflows/github-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Sestavi stran
        run: |
          mkdir _site
          cp -r github_pages/. _site/
          cp -r img vrstice.txt _site/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5
